name: Player APK

# Builds the projector player app and publishes the APK as a GitHub Release on every push that
# touches it, so the projector can download the latest build from its browser without adb.
on:
  push:
    branches: ['**']
    paths: ['core/**', 'playerCore/**', 'playerApp/**', 'gradle/**', '*.gradle.kts', '.github/workflows/player-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OZ_KEYSTORE_BASE64: ${{ secrets.OZ_KEYSTORE_BASE64 }}
      OZ_KEYSTORE_PASSWORD: ${{ secrets.OZ_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        if: env.OZ_KEYSTORE_BASE64 != ''
        run: |
          # Drop whitespace and quotes a paste can add; accept URL-safe base64 too.
          key=$(printf '%s' "$OZ_KEYSTORE_BASE64" | tr -d ' \r\n\t"' | tr -- '-_' '+/')
          if ! printf '%s' "$key" | base64 -d > "$RUNNER_TEMP/oz.jks" 2>/dev/null; then
            # Describe the secret's shape without revealing it.
            mii=$([ "${key:0:3}" = "MII" ] && echo yes || echo no)
            odd=$(printf '%s' "$key" | tr -d 'A-Za-z0-9+/=' | fold -w1 | sort -u | tr -d '\n' | od -An -c | tr -s ' ')
            echo "::error::OZ_KEYSTORE_BASE64 isn't base64 text (${#key} characters, starts with MII: $mii, unexpected characters:${odd:- none}). A keystore copied as base64 is about 3500 characters starting with 'MII'."
            exit 1
          fi
          keytool -list -keystore "$RUNNER_TEMP/oz.jks" -storepass "$OZ_KEYSTORE_PASSWORD" -alias oz > /dev/null \
            || { echo "::error::The OZ_KEYSTORE secrets don't open a keystore with an 'oz' key. Check both secrets."; exit 1; }
          echo "OZ_KEYSTORE_PATH=$RUNNER_TEMP/oz.jks" >> "$GITHUB_ENV"
      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew :core:allTests :playerCore:test :playerApp:assembleDebug
      - run: cp playerApp/build/outputs/apk/debug/playerApp-debug.apk oz-player.apk
      - uses: actions/upload-artifact@v4
        with:
          name: oz-player-apk
          path: oz-player.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: player-v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Player 0.1.${{ github.run_number }} (${{ github.ref_name }})
          prerelease: ${{ github.ref_name != 'master' }}
          make_latest: true
          files: oz-player.apk
          body: |
            Projector player app. On the projector, open this page in the browser, download
            oz-player.apk, open it and allow "Install unknown apps" when Android asks.
