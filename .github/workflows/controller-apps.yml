name: Controller apps

# Builds the controller for phones (APK) and Windows (MSI installer) and publishes both as a
# GitHub Release on every push that touches them.
on:
  push:
    branches: ['**']
    paths: ['blender/**', 'core/**', 'playerCore/**', 'controllerCore/**', 'shared/**', 'androidApp/**', 'desktopApp/**', 'gradle/**', '*.gradle.kts', '.github/workflows/controller-apps.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      OZ_KEYSTORE_BASE64: ${{ secrets.OZ_KEYSTORE_BASE64 }}
      OZ_KEYSTORE_PASSWORD: ${{ secrets.OZ_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        if: env.OZ_KEYSTORE_BASE64 != ''
        run: |
          # Drop whitespace and quotes a paste can add; accept URL-safe base64 too.
          key=$(printf '%s' "$OZ_KEYSTORE_BASE64" | tr -d ' \r\n\t"' | tr -- '-_' '+/')
          if ! printf '%s' "$key" | base64 -d > "$RUNNER_TEMP/oz.jks" 2>/dev/null; then
            # Describe the secret's shape without revealing it.
            mii=$([ "${key:0:3}" = "MII" ] && echo yes || echo no)
            odd=$(printf '%s' "$key" | tr -d 'A-Za-z0-9+/=' | fold -w1 | sort -u | tr -d '\n' | od -An -c | tr -s ' ')
            echo "::error::OZ_KEYSTORE_BASE64 isn't base64 text (${#key} characters, starts with MII: $mii, unexpected characters:${odd:- none}). A keystore copied as base64 is about 3500 characters starting with 'MII'."
            exit 1
          fi
          keytool -list -keystore "$RUNNER_TEMP/oz.jks" -storepass "$OZ_KEYSTORE_PASSWORD" -alias oz > /dev/null \
            || { echo "::error::The OZ_KEYSTORE secrets don't open a keystore with an 'oz' key. Check both secrets."; exit 1; }
          echo "OZ_KEYSTORE_PATH=$RUNNER_TEMP/oz.jks" >> "$GITHUB_ENV"
      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew :controllerCore:jvmTest :androidApp:assembleDebug
      - run: cp androidApp/build/outputs/apk/debug/androidApp-debug.apk oz-controller.apk
      - uses: actions/upload-artifact@v4
        with:
          name: oz-controller-apk
          path: oz-controller.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installer
        run: ./gradlew :desktopApp:packageMsi
      - name: Rename installer
        shell: bash
        run: cp desktopApp/build/compose/binaries/main/msi/*.msi oz-controller.msi
      - uses: actions/upload-artifact@v4
        with:
          name: oz-controller-msi
          path: oz-controller.msi

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: blender
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: controller-v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Controller 0.1.${{ github.run_number }} (${{ github.ref_name }})
          prerelease: ${{ github.ref_name != 'master' }}
          # Keeps the "latest" link pointing at the projector player.
          make_latest: false
          files: |
            oz-controller.apk
            oz-controller.msi
            blender/oz_projection_export.py
          body: |
            Controller app. On a Windows PC, download and run oz-controller.msi. On an Android phone,
            download oz-controller.apk, open it and allow "Install unknown apps" when Android asks.
            For Blender, download oz_projection_export.py and install it from Edit > Preferences > Add-ons (Install from Disk).
